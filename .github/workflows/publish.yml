name: Publish to PyPI

# Trusted publishing (OIDC): no API token stored anywhere. One-time setup on
# PyPI: Manage project -> Publishing -> add GitHub publisher with owner
# PavolKum, repository claude-quota-mcp, workflow publish.yml, environment pypi.
# For a brand-new project use "Add a new pending publisher" with the same
# values before the first tag. Then: git tag v0.2.0 && git push origin v0.2.0.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python test_hook_bridge.py
      - run: python test_statusline.py

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
